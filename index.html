<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic User Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Directory</h1>
        <small>This is a list of students</small>
    </header>

    <section id="formContainer">
        <form id="studentform">
            <div class="input-fields">
                <label for="name">Student Name</label>
                <input type="text" name="name" id="name" placeholder="Enter full name" required>
            </div>
            <div class="input-fields">
                <label for="program">Program</label>
                <input type="text" name="program" id="program" placeholder="Enter program" required>
            </div>
            <div>
                <button for="submit"> Add Student</button>
            </div>
        </form>
    </section>

    <section id="studentList">
        
    </section>

    <script src="script.js"></script>



</body>
</html>
